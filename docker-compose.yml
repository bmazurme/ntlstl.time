services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-reports}
      POSTGRES_USER: ${DB_USERNAME:-reports}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-reports}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-reports}']
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-reports}
      DB_PASSWORD: ${DB_PASSWORD:-reports}
      DB_NAME: ${DB_NAME:-reports}
      GITLAB_URL: ${GITLAB_URL:-}
      PRIVATE_TOKEN: ${PRIVATE_TOKEN:-}
      USER_ID: ${USER_ID:-}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
